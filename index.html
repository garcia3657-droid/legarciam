<style>
:root{
  --bg:#0D1014; --surface:#14181E; --ink:#ECEEF1; --muted:#8B94A1; --line:#232A33; --accent:#3FB57A; --on-accent:#06110B;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;min-height:100vh;display:flex;justify-content:center;padding:40px 20px 56px}
main{width:100%;max-width:420px}
.head{text-align:center;margin-bottom:32px}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 20px;background:#000;border:1px solid var(--line);display:grid;place-items:center;font-size:34px;font-weight:700;letter-spacing:.02em;color:var(--accent);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.role{color:var(--muted);margin-top:4px;font-size:15px}
.bio{margin:16px auto 0;max-width:34ch;font-size:15px;color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;transition:border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn svg{width:18px;height:18px;flex:none}
.links{border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.links b{font-weight:500;font-size:16px}
.links span{color:var(--muted);font-size:14px}
.links a:hover b{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:32px}
</style>
</head>
